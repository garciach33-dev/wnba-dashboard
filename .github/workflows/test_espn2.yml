name: 測試 ESPN 傷兵資料結構

# 第二次一次性診斷：只能手動觸發，不排程、不碰資料庫、不部署。
# 上一次確認「連得到」，這一次要看清楚「賽前」的傷兵資料長什麼樣子，
# 才能把解析器寫對，而不是盲寫一個永遠回傳空清單的東西。
on:
  workflow_dispatch: {}

jobs:
  shape:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ESPN injury shape
        shell: bash
        run: |
          cat > shape.py <<'PY'
          import json, urllib.request, urllib.error

          UA = {"User-Agent": "Mozilla/5.0 (compatible; wnba-dashboard/1.0)"}
          SITE = "https://site.api.espn.com/apis/site/v2/sports/basketball/wnba"
          CORE = "https://sports.core.api.espn.com/v2/sports/basketball/leagues/wnba"


          def get(url, cap=6_000_000):
              """完整讀回來再解析。上一次只讀 400KB 導致 JSON 被截斷，這次不能再犯。"""
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read(cap))


          def short(v, n=90):
              s = str(v).replace("\n", " ")
              return s if len(s) <= n else s[:n] + "…"


          # ---------- A) 今天有哪些場、狀態是不是「賽前」----------
          print("=== A) scoreboard 今日賽事 ===")
          pre_ids, any_ids = [], []
          try:
              sb = get(SITE + "/scoreboard")
              for e in sb.get("events", []):
                  comp = (e.get("competitions") or [{}])[0]
                  st = ((comp.get("status") or {}).get("type") or {}).get("state")
                  teams = "/".join(
                      (c.get("team") or {}).get("abbreviation", "?")
                      for c in comp.get("competitors", [])
                  )
                  print(f"  event={e.get('id')}  {teams}  state={st}  {e.get('date')}")
                  any_ids.append(str(e.get("id")))
                  if st == "pre":
                      pre_ids.append(str(e.get("id")))
              if not sb.get("events"):
                  print("  （今天沒有比賽）")
          except Exception as e:
              print(f"  失敗 {type(e).__name__}: {e}")

          # ---------- B) summary 的 injuries 區塊（賽前這場最重要）----------
          target = pre_ids[0] if pre_ids else (any_ids[0] if any_ids else "401892393")
          print(f"\n=== B) summary injuries  event={target}"
                f"{'（賽前）' if pre_ids else '（沒有賽前場次，用其他場代替）'} ===")
          try:
              d = get(SITE + f"/summary?event={target}")
              inj = d.get("injuries") or []
              print(f"  injuries 區塊：{len(inj)} 隊")
              first = None
              for t in inj:
                  tm = t.get("team") or {}
                  items = t.get("injuries") or []
                  print(f"  -- {tm.get('abbreviation')} ({tm.get('id')})  n={len(items)}")
                  for it in items[:6]:
                      ath = it.get("athlete") or {}
                      typ = it.get("type") or {}
                      print(f"       id={ath.get('id')}  {ath.get('displayName')}"
                            f"  status={it.get('status')!r}"
                            f"  type={typ.get('description') or typ.get('name')!r}"
                            f"  detail={short(it.get('details') or it.get('shortComment'), 50)!r}")
                      if first is None:
                          first = it
              if first is not None:
                  print(f"  單筆的欄位名稱：{list(first)}")
                  print(f"  athlete 的欄位名稱：{list(first.get('athlete') or {})[:14]}")
              else:
                  print("  ⚠ injuries 區塊是空的 —— 這場沒人掛傷兵名單，或賽前不提供")
          except Exception as e:
              print(f"  失敗 {type(e).__name__}: {e}")

          # ---------- C) core API 每隊傷兵（備援，一天 13 次就能蓋全聯盟）----------
          print("\n=== C) core API teams/9/injuries 結構 ===")
          try:
              c = get(CORE + "/teams/9/injuries")
              print(f"  count={c.get('count')}  items={len(c.get('items', []))}  keys={list(c)}")
              items = c.get("items") or []
              if items:
                  it0 = items[0]
                  print(f"  item[0] keys={list(it0)}")
                  ref = it0.get("$ref")
                  if ref and len(it0) <= 2:
                      print(f"  item[0] 是 $ref，追進去：{short(ref, 100)}")
                      it0 = get(ref.replace("http://", "https://"))
                      print(f"  追進去後 keys={list(it0)}")
                  print(f"  status={it0.get('status')!r}  date={short(it0.get('date'), 30)}")
                  print(f"  type={short(it0.get('type'), 120)}")
                  ath = it0.get("athlete") or {}
                  if "$ref" in ath and len(ath) <= 2:
                      a = get(ath["$ref"].replace("http://", "https://"))
                      print(f"  athlete 追進去：id={a.get('id')} {a.get('displayName')}")
                  else:
                      print(f"  athlete={short(ath, 120)}")
              else:
                  print("  ⚠ 這隊目前沒有傷兵")
          except Exception as e:
              print(f"  失敗 {type(e).__name__}: {e}")

          # ---------- D) 球隊 id ↔ 縮寫對照（core API 要用 id）----------
          print("\n=== D) 球隊 id 對照 ===")
          try:
              t = get(SITE + "/teams")
              lst = (((t.get("sports") or [{}])[0].get("leagues") or [{}])[0]).get("teams") or []
              pairs = []
              for x in lst:
                  tm = x.get("team") or {}
                  pairs.append(f"{tm.get('id')}={tm.get('abbreviation')}")
              print("  " + "  ".join(pairs))
              print(f"  共 {len(pairs)} 隊")
          except Exception as e:
              print(f"  失敗 {type(e).__name__}: {e}")

          print("\n=== 結束 ===")
          PY
          python3 shape.py
