name: WNBA 每日預測與部署

# 排程時間為 UTC。台北時間 = UTC+8。
#
# 時間點是照 2026 年實際賽程排的（台北時間開賽：07:00 有 59 場、
# 08:00 有 37 場、10:00 有 54 場，週末另有一批落在凌晨 01:00～04:00）：
#
#   21:17 UTC = 05:17 台北 —— 07:00 那批開賽前約 1.5 小時的最後一次重算。
#               這一次是後來補的：原本最早的排程就在 07:00，跟 59 場比賽的
#               開球時間正面對撞，加上 GitHub 排程本身會延遲，那批比賽等於
#               永遠拿不到當天的傷兵資訊（predict.py 不動已開賽的比賽）。
#   23:17 UTC = 07:17 台北 —— 服務 08:00、10:00 開打的 91 場，臨近開賽的更新。
#   11:17 UTC = 19:17 台北 —— 結算：前一天的美國賽事最晚約台北 12:30 打完，
#               這時候跑最乾淨。
#
# 分鐘刻意設 17 不設 0：整點是全 GitHub 最壅塞的一分鐘，排隊排前面一點。
# 即使如此，排程延遲十幾分鐘到一小時仍屬常態，必要時到 Actions 頁面手動觸發。
on:
  schedule:
    - cron: "17 21 * * *"
    - cron: "17 23 * * *"
    - cron: "17 11 * * *"
  workflow_dispatch: {}   # 也可在 Actions 頁面手動觸發

permissions:
  contents: write   # 需要把更新後的 data/wnba.db 推回 repo，保存歷史快照
  pages: write
  id-token: write

concurrency:
  group: wnba-daily
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        run: python src/run_daily.py
        env:
          # 到 the-odds-api.com 申請免費金鑰，存成 repo secret「ODDS_API_KEY」。
          # 沒設定也沒關係——系統會自動略過盤口、投注區隱藏，其餘照常。
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Google Apps Script Web App 網址，存成 repo secret「BETS_ENDPOINT」。
          # 用來讓「我的下注紀錄」表單跨裝置存到你的 Google 試算表。沒設定則該區顯示設定說明。
          BETS_ENDPOINT: ${{ secrets.BETS_ENDPOINT }}

      - name: Commit updated database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wnba.db
          if git diff --staged --quiet; then
            echo "資料庫無變動，略過 commit"
          else
            git commit -m "chore: 每日更新預測與結算 [skip ci]"
            git push
          fi

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
