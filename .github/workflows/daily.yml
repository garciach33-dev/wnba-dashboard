name: WNBA 每日預測與部署

# 排程時間為 UTC。台北時間 = UTC+8。
#   23:00 UTC = 隔日 07:00 台北（早晨：結算昨夜美國賽事 + 更新今日預測）
#   11:00 UTC = 19:00 台北（傍晚：再更新一次未來預測）
on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # 也可在 Actions 頁面手動觸發

permissions:
  contents: write   # 需要把更新後的 data/wnba.db 推回 repo，保存歷史快照
  pages: write
  id-token: write

concurrency:
  group: wnba-daily
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        run: python src/run_daily.py
        env:
          # 到 the-odds-api.com 申請免費金鑰，存成 repo secret「ODDS_API_KEY」。
          # 沒設定也沒關係——系統會自動略過盤口、投注區隱藏，其餘照常。
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Google Apps Script Web App 網址，存成 repo secret「BETS_ENDPOINT」。
          # 用來讓「我的下注紀錄」表單跨裝置存到你的 Google 試算表。沒設定則該區顯示設定說明。
          BETS_ENDPOINT: ${{ secrets.BETS_ENDPOINT }}

      - name: Commit updated database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wnba.db
          if git diff --staged --quiet; then
            echo "資料庫無變動，略過 commit"
          else
            git commit -m "chore: 每日更新預測與結算 [skip ci]"
            git push
          fi

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
